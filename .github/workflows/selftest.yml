name: Self-test

# Runs in this repository only: the test suite, plus a call into the
# reusable check.yml workflow defined alongside this file, so that the
# reusable workflow is exercised by an actual `uses:` call before any
# other repository ever depends on it.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # setup-python provides a clean interpreter with pip and nothing else, so
      # pytest must be installed explicitly. The container image used during
      # development bakes pytest in, which is why running the suite there, and
      # in a clone there, passed while this job failed in eight seconds.
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q -p no:cacheprovider

  self-check:
    name: Self-check via reusable workflow
    needs: test
    # Local path form (`./...`), so this always calls the copy of
    # check.yml at the commit under test on this run, never a published
    # copy elsewhere.
    uses: ./.github/workflows/check.yml
    with:
      # This job is both caller and declutter repository at once, so
      # github.repository is correct here in a way it would not be for an
      # external consumer -- see check.yml's declutter-repository
      # description.
      declutter-repository: ${{ github.repository }}
      # Pinned to the exact commit under test, not a branch, so this
      # checks the code this workflow run is actually validating.
      declutter-ref: ${{ github.sha }}
      mode: all
      critical-only: true
